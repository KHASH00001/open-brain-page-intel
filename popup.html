<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 350px; padding: 16px; font-family: Arial, sans-serif; background: #1a1a2e; color: #e0e0e0; }
    h2 { margin: 0 0 12px; font-size: 16px; color: #00d4ff; }
    button { width: 100%; padding: 10px; background: #00d4ff; color: #1a1a2e; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    button:hover { background: #00b8d9; }
    #status { margin-top: 12px; font-size: 12px; color: #aaa; }
    #summary { margin-top: 12px; font-size: 13px; line-height: 1.5; max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Page Intel</h2>
  <button id="analyze">Analyze Page</button>
  <div id="status"></div>
  <div id="summary"></div>
  <script src="popup.js"></script>
</body>
</html>
